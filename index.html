<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  :root { --teal: #00acc1; --teal-dark: #00838f; --bg: #f0f0f0; --text: #1a1a1a; --muted: #888; --border: #ddd; }
  body { font-family: 'Inter', sans-serif; background: var(--bg); color: var(--text); min-height: 100vh; font-size: 14px; }
  .topbar { background: var(--teal); display: flex; align-items: center; height: 48px; box-shadow: 0 2px 6px rgba(0,0,0,0.2); }
  .topbar-logo { background: var(--teal-dark); width: 48px; height: 48px; display: flex; align-items: center; justify-content: center; flex-shrink: 0; }
  .topbar-logo svg { width: 24px; height: 24px; fill: white; }
  .topbar-title { font-size: 15px; font-weight: 600; color: white; padding: 0 0.75rem; flex: 1; }
  .topbar-count { font-size: 11px; color: rgba(255,255,255,0.8); padding: 0 0.75rem; white-space: nowrap; }
  .sortbar { background: white; border-bottom: 1px solid var(--border); padding: 0.5rem 0.75rem; display: flex; align-items: center; gap: 0.6rem; flex-wrap: wrap; }
  .sortbar label { font-size: 10px; color: var(--muted); font-weight: 600; text-transform: uppercase; letter-spacing: 0.06em; }
  .sortbar select { font-family: 'Inter', sans-serif; font-size: 12px; padding: 4px 6px; border: 1px solid var(--border); border-radius: 4px; background: white; color: var(--text); cursor: pointer; outline: none; }
  .page-info { margin-left: auto; font-size: 11px; color: var(--muted); }
  .per-page-wrap { display: flex; align-items: center; gap: 0.3rem; font-size: 10px; color: var(--muted); font-weight: 600; text-transform: uppercase; }
  .filter-banner { display:none; background: var(--teal-dark); color:white; padding: 0.5rem 0.75rem; font-size:12px; align-items:center; gap:0.5rem; }
  .filter-banner.show { display:flex; }
  .filter-clear { margin-left:auto; background:rgba(255,255,255,0.2); border:none; color:white; font-size:11px; padding:3px 10px; border-radius:99px; cursor:pointer; font-family:'Inter',sans-serif; }

  .detail-panel { display:none; background:white; border:1px solid var(--border); border-radius:8px; margin:0.75rem 0.75rem 0; overflow:hidden; box-shadow:0 4px 20px rgba(0,0,0,0.1); }
  .detail-panel.open { display:block; }
  .detail-header { background:var(--teal); padding:0.85rem 1rem; display:flex; align-items:center; justify-content:space-between; gap:0.75rem; }
  .detail-header-title { font-size:14px; font-weight:600; color:white; line-height:1.3; flex:1; }
  .detail-close { background:rgba(255,255,255,0.2); border:none; color:white; width:28px; height:28px; border-radius:50%; font-size:16px; cursor:pointer; display:flex; align-items:center; justify-content:center; flex-shrink:0; }
  .detail-body { display:flex; gap:1rem; padding:1rem; }
  .detail-cover { width:90px; min-width:90px; height:130px; border-radius:3px 6px 6px 3px; overflow:hidden; box-shadow:-3px 0 0 rgba(0,0,0,0.15),4px 4px 10px rgba(0,0,0,0.18); background:#d8ccb4; flex-shrink:0; }
  .detail-cover img { width:100%; height:100%; object-fit:cover; display:block; }
  .detail-cover-ph { width:100%; height:100%; display:flex; align-items:center; justify-content:center; background:linear-gradient(145deg,#d8ccb4,#c4b898); font-size:9px; color:#7a6a50; text-align:center; padding:6px; font-style:italic; line-height:1.3; }
  .detail-meta { flex:1; min-width:0; display:flex; flex-direction:column; gap:0.4rem; }
  .detail-author { font-size:13px; color:var(--teal-dark); font-weight:600; cursor:pointer; display:inline-block; border-bottom:1px dashed var(--teal-dark); width:fit-content; }
  .detail-info { font-size:11.5px; color:var(--muted); line-height:1.5; }
  .detail-info strong { color:var(--text); font-weight:500; }
  .detail-genre-link { display:inline; font-size:11.5px; color:var(--teal-dark); font-weight:500; cursor:pointer; border-bottom:1px dashed var(--teal-dark); text-transform:capitalize; }
  .detail-tags { padding:0 1rem 0.75rem; display:flex; flex-wrap:wrap; gap:4px; }
  .detail-tag { font-size:10px; padding:2px 8px; border-radius:99px; background:#e0f7fa; color:var(--teal-dark); font-weight:500; }
  .detail-btn { display:block; margin:0 1rem 1rem; text-align:center; background:var(--teal); color:white; padding:0.55rem 1rem; border-radius:6px; font-size:13px; font-weight:600; text-decoration:none; }
  .detail-review { padding:0.75rem 1rem 1rem; font-size:12px; color:#444; line-height:1.6; border-top:1px solid var(--border); }
  .detail-review-label { font-size:10px; font-weight:700; text-transform:uppercase; letter-spacing:0.1em; color:var(--muted); margin-bottom:0.3rem; }
  .star { color:#f5c518; font-size:13px; } .star.empty { color:#ddd; }

  .main { padding:0.75rem; }
  .books-grid { display:grid; grid-template-columns:repeat(3,minmax(0,1fr)); gap:1px; background:var(--border); border:1px solid var(--border); border-radius:6px; overflow:hidden; width:100%; }
  .book-card { background:white; display:flex; flex-direction:column; align-items:center; text-align:center; padding:0.7rem 0.4rem 0.65rem; gap:0.4rem; transition:background 0.1s; min-width:0; overflow:hidden; cursor:pointer; }
  .book-card:hover { background:#e8f9fb; }
  .book-card.selected { background:#e0f7fa; outline:2px solid var(--teal); }
  .book-cover { width:64px; height:92px; border-radius:2px 5px 5px 2px; overflow:hidden; box-shadow:-2px 0 0 rgba(0,0,0,0.12),2px 2px 6px rgba(0,0,0,0.18); background:#d8ccb4; flex-shrink:0; }
  .book-cover img { width:100%; height:100%; object-fit:cover; display:block; }
  .cover-ph { width:100%; height:100%; display:flex; align-items:center; justify-content:center; background:linear-gradient(145deg,#d8ccb4,#c4b898); font-size:7.5px; color:#7a6a50; text-align:center; padding:4px; font-style:italic; line-height:1.3; }
  .book-title { font-size:11px; font-weight:600; line-height:1.3; color:var(--text); display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; overflow:hidden; width:100%; }
  .book-author { font-size:10px; color:var(--teal-dark); font-weight:500; width:100%; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .book-genre { font-size:10px; color:var(--muted); text-transform:capitalize; width:100%; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }

  .pagination { display:flex; align-items:center; justify-content:center; gap:3px; padding:1rem 0 0.5rem; flex-wrap:wrap; }
  .pg-btn { font-family:'Inter',sans-serif; font-size:12px; min-width:30px; height:30px; padding:0 6px; border:1px solid var(--border); border-radius:4px; background:white; color:var(--text); cursor:pointer; display:flex; align-items:center; justify-content:center; }
  .pg-btn:hover:not(:disabled) { background:var(--teal); color:white; border-color:var(--teal); }
  .pg-btn.active { background:var(--teal); color:white; border-color:var(--teal); font-weight:600; }
  .pg-btn:disabled { opacity:0.3; cursor:default; }
  .pg-dots { font-size:12px; color:var(--muted); padding:0 2px; line-height:30px; }
  .pg-label { font-size:11px; color:var(--muted); margin-left:0.4rem; }
</style>
</head>

  if (!tags || !tags.length) return '';
  for (var i=0;i<GENRE_PRIORITY.length;i++) {
    for (var j=0;j<tags.length;j++) {
      if (tags[j].toLowerCase() === GENRE_PRIORITY[i]) return tags[j];
    }
  }
  return tags[0];
}

function esc(s) {
  return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

function getCoverUrl(isbn) {
  return 'https://books.google.com/books/content?vid=ISBN' + isbn + '&printsec=frontcover&img=1&zoom=1&source=gbs_api';
}

function tinycatUrl(book) {
  if (book.book_id) return 'https://www.librarycat.org/lib/ArjunShah/item/' + book.book_id;
  return 'https://www.librarycat.org/lib/ArjunShah/search/text/' + encodeURIComponent(book.title);
}

function filterByAuthor(author) {
  closeDetail();
  filteredBooks = ALL_BOOKS.filter(function(b){ return b.author === author; });
  books = filteredBooks.slice(); page = 1;
  document.getElementById('filter-label').innerHTML = 'Books by <strong>' + esc(author) + '</strong> (' + filteredBooks.length + ')';
  document.getElementById('filter-banner').classList.add('show');
  render();
}

function filterByGenre(genre) {
  closeDetail();
  filteredBooks = ALL_BOOKS.filter(function(b){ return getFirstTag(b.tags).toLowerCase() === genre.toLowerCase(); });
  books = filteredBooks.slice(); page = 1;
  document.getElementById('filter-label').innerHTML = 'Genre: <strong>' + esc(genre) + '</strong> (' + filteredBooks.length + ' books)';
  document.getElementById('filter-banner').classList.add('show');
  render();
}

function clearFilter() {
  filteredBooks = null; books = ALL_BOOKS.slice(); page = 1;
  document.getElementById('filter-banner').classList.remove('show');
  closeDetail(); render();
}

function openDetail(book, cardEl) {
  if (selectedCard) selectedCard.classList.remove('selected');
  selectedCard = cardEl;
  cardEl.classList.add('selected');

  document.getElementById('detail-title').textContent = book.title;

  var coverEl = document.getElementById('detail-cover');
  coverEl.innerHTML = '';
  if (book.isbn) {
    var img = document.createElement('img');
    img.alt = '';
    img.onerror = function() { coverEl.innerHTML = '<div class="detail-cover-ph">' + esc(book.title) + '</div>'; };
    img.src = getCoverUrl(book.isbn);
    coverEl.appendChild(img);
  } else {
    coverEl.innerHTML = '<div class="detail-cover-ph">' + esc(book.title) + '</div>';
  }

  var genre = getFirstTag(book.tags);
  var meta = document.getElementById('detail-meta');
  meta.innerHTML = '';

  var authorEl = document.createElement('div');
  authorEl.className = 'detail-author';
  authorEl.innerHTML = esc(book.author) + ' <span style="font-size:10px;opacity:0.6">↗</span>';
  authorEl.addEventListener('click', (function(a){ return function(){ filterByAuthor(a); }; })(book.author));
  meta.appendChild(authorEl);

  if (genre) {
    var gd = document.createElement('div'); gd.className='detail-info';
    gd.innerHTML = '<strong>Genre:</strong> ';
    var gl = document.createElement('span'); gl.className='detail-genre-link';
    gl.innerHTML = esc(genre) + ' <span style="font-size:10px;opacity:0.6">↗</span>';
    gl.addEventListener('click', (function(g){ return function(){ filterByGenre(g); }; })(genre));
    gd.appendChild(gl); meta.appendChild(gd);
  }

  if (book.publication) { var d=document.createElement('div'); d.className='detail-info'; d.innerHTML='<strong>Published:</strong> '+esc(book.publication); meta.appendChild(d); }
  if (book.language) { var d=document.createElement('div'); d.className='detail-info'; d.innerHTML='<strong>Language:</strong> '+esc(book.language); meta.appendChild(d); }
  if (book.isbn) { var d=document.createElement('div'); d.className='detail-info'; d.innerHTML='<strong>ISBN:</strong> '+esc(book.isbn); meta.appendChild(d); }
  if (book.rating) {
    var n = parseInt(book.rating)||0;
    if (n) {
      var rd=document.createElement('div'); rd.style.display='flex'; rd.style.gap='2px'; rd.style.marginTop='2px';
      for (var i=1;i<=5;i++) { var s=document.createElement('span'); s.className='star'+(i>n?' empty':''); s.textContent='★'; rd.appendChild(s); }
      meta.appendChild(rd);
    }
  }

  var tagsEl = document.getElementById('detail-tags');
  tagsEl.innerHTML = '';
  (book.tags||[]).forEach(function(t){ var sp=document.createElement('span'); sp.className='detail-tag'; sp.textContent=t; tagsEl.appendChild(sp); });

  document.getElementById('detail-btn').href = tinycatUrl(book);

  var rEl = document.getElementById('detail-review');
  if (book.review) { rEl.innerHTML='<div class="detail-review-label">Review</div>'+esc(book.review); rEl.style.display=''; }
  else rEl.style.display='none';

  document.getElementById('detail-panel').classList.add('open');
  document.getElementById('detail-panel').scrollIntoView({behavior:'smooth',block:'start'});
}

function closeDetail() {
  document.getElementById('detail-panel').classList.remove('open');
  if (selectedCard) { selectedCard.classList.remove('selected'); selectedCard = null; }
}

function sortBooks() {
  if (sortMode==='title') books.sort(function(a,b){return a.title.localeCompare(b.title);});
  else if (sortMode==='title_desc') books.sort(function(a,b){return b.title.localeCompare(a.title);});
  else books.sort(function(a,b){return (a.author||'').localeCompare(b.author||'');});
}

function renderGrid() {
  var grid = document.getElementById('books-grid');
  var start = (page-1)*perPage;
  var slice = books.slice(start, start+perPage);
  grid.innerHTML = ''; selectedCard = null;

  slice.forEach(function(book) {
    var genre = getFirstTag(book.tags);
    var card = document.createElement('div'); card.className='book-card';

    var cd = document.createElement('div'); cd.className='book-cover';
    if (book.isbn) {
      var img = document.createElement('img'); img.loading='lazy'; img.alt='';
      img.onerror = function() { cd.innerHTML='<div class="cover-ph">'+esc(book.title)+'</div>'; };
      img.src = getCoverUrl(book.isbn);
      cd.appendChild(img);
    } else { cd.innerHTML='<div class="cover-ph">'+esc(book.title)+'</div>'; }
    card.appendChild(cd);

    var td=document.createElement('div'); td.className='book-title'; td.textContent=book.title; card.appendChild(td);
    var ad=document.createElement('div'); ad.className='book-author'; ad.textContent=book.author; card.appendChild(ad);
    if (genre) { var gd=document.createElement('div'); gd.className='book-genre'; gd.textContent=genre; card.appendChild(gd); }

    card.addEventListener('click', (function(b,c){ return function(){ openDetail(b,c); }; })(book,card));
    grid.appendChild(card);
  });

  document.getElementById('page-info').textContent = (start+1)+'–'+Math.min(start+perPage,books.length)+' of '+books.length;
  window.scrollTo(0,0);
}

function renderPagination() {
  var total = Math.ceil(books.length/perPage);
  var pag = document.getElementById('pagination');
  pag.innerHTML = '';
  function mkBtn(label, cb, disabled, active) {
    var b = document.createElement('button');
    b.className = 'pg-btn'+(active?' active':'');
    b.textContent = label; b.disabled = !!disabled;
    if (cb) b.addEventListener('click', cb);
    pag.appendChild(b);
  }
  mkBtn('‹', function(){page--;render();}, page===1, false);
  var pages=[];
  if(total<=7) { for(var i=1;i<=total;i++) pages.push(i); }
  else { pages=[1]; if(page>3) pages.push('…'); for(var i=Math.max(2,page-1);i<=Math.min(total-1,page+1);i++) pages.push(i); if(page<total-2) pages.push('…'); pages.push(total); }
  pages.forEach(function(p) {
    if(p==='…') { var s=document.createElement('span'); s.className='pg-dots'; s.textContent='…'; pag.appendChild(s); }
    else mkBtn(p, (function(pp){ return function(){ page=pp; render(); }; })(p), false, p===page);
  });
  mkBtn('›', function(){page++;render();}, page===total, false);
  var lbl=document.createElement('span'); lbl.className='pg-label'; lbl.textContent='Page '+page+' of '+total; pag.appendChild(lbl);
}

function render() { sortBooks(); renderGrid(); renderPagination(); }

document.getElementById('sort-select').addEventListener('change', function(e){ sortMode=e.target.value; page=1; render(); });
document.getElementById('per-page-select').addEventListener('change', function(e){ perPage=parseInt(e.target.value); page=1; render(); });
document.getElementById('detail-close').addEventListener('click', closeDetail);
document.getElementById('filter-clear-btn').addEventListener('click', clearFilter);

render();
</script>
</body>
</html>
